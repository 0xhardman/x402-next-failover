name: Publish to npm

# Trigger on version tag push (e.g., v0.1.0, v1.2.3)
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # Required permissions for Trusted Publishers with OIDC
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      # Uncomment to enable tests
      # - name: Run tests
      #   run: npm test

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        # Note: Using npm Trusted Publishers (OIDC)
        # No NPM_TOKEN needed - authentication via GitHub OIDC
        # See PUBLISH_GUIDE.md for setup instructions
